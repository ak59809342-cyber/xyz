<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="auth-shell">
      <div class="auth-card">
        <section class="auth-visual">
          <div class="brand-wrap">
            <img src="images/logo.jpg" alt="Brand logo" class="brand-logo" />
            <span>Brand</span>
          </div>

          <h1>Welcome back</h1>
          <p>
            Sign in to manage your projects, access your dashboard, and stay
            connected with your team.
          </p>

          <ul class="feature-list">
            <li>Fast project access</li>
            <li>Private workspace</li>
            <li>Secure account login</li>
          </ul>
        </section>

        <section class="auth-form-panel">
          <div class="form-header">
            <span class="eyebrow">Account Login</span>
            <h2>Log In</h2>
          </div>

          <form class="login-form">
            <label class="input-group">
              <span>Email</span>
              <input type="email" placeholder="you@example.com" required />
            </label>

            <label class="input-group">
              <span>Password</span>
              <input type="password" placeholder="Enter your password" required />
            </label>

            <div class="row-between">
              <label class="remember-me">
                <input type="checkbox" />
                <span>Remember me</span>
              </label>
              <a href="#">Forgot password?</a>
            </div>

            <button type="submit">Login</button>
          </form>

          <p class="signup-text">
            Don’t have an account?
            <a href="#">Create one</a>
          </p>
        </section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
